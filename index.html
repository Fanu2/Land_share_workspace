let all=[],folder="All",type="All";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const ext=x=>x.replace(".","").toUpperCase();
function init(){
  DATA.sections.forEach(s=>s.entries.forEach(e=>all.push({...e,folder:s.folder})));
  stats(); folders(); types(); render();
}
function stats(){
  const by={}; all.forEach(x=>by[x.ext]=(by[x.ext]||0)+1);
  document.getElementById("stats").innerHTML=[
    [all.length,"Documents"],["158.30 MB","Archive Size"],[DATA.sections.length,"Folders"],
    [by[".htm"]||0,"HTML"],[by[".pdf"]||0,"PDF"],[Object.keys(by).length,"File Types"]
  ].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
}
function folders(){
  let h=`<button class="folder-btn ${folder==="All"?"active":""}" onclick="setFolder('All')">All documents <span class="n">${all.length}</span></button>`;
  DATA.sections.forEach(s=>h+=`<button class="folder-btn ${folder===s.folder?"active":""}" onclick="setFolder(${JSON.stringify(s.folder)})">${esc(s.folder)} <span class="n">${s.entries.length}</span></button>`);
  document.getElementById("folders").innerHTML=h;
}
function types(){
  const types=["All",...new Set(all.map(x=>x.ext))];
  document.getElementById("chips").innerHTML=types.map(t=>`<button class="chip ${type===t?"active":""}" onclick="setType(${JSON.stringify(t)})">${t==="All"?"All types":esc(ext(t))}</button>`).join("");
}
function setFolder(x){folder=x;folders();render()} function setType(x){type=x;types();render()}
function filtered(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  let a=all.filter(x=>(folder==="All"||x.folder===folder)&&(type==="All"||x.ext===type));
  if(q)a=a.filter(x=>(x.name+" "+x.folder+" "+x.ext).toLowerCase().includes(q));
  const s=document.getElementById("sort").value;
  a.sort((x,y)=>String(x[s]).localeCompare(String(y[s]),undefined,{numeric:true,sensitivity:"base"}));
  return a;
}
function render(){
 const a=filtered(); document.getElementById("result").textContent=`${a.length} documents shown`;
 document.getElementById("cards").innerHTML=a.length?a.map((x,i)=>`<article class="card"><div class="row"><div><div class="name">${esc(x.name)}</div><div class="folder">📁 ${esc(x.folder)}</div></div><span class="badge">${esc(ext(x.ext))}</span></div><div class="meta">${esc(x.size)}</div><div class="actions"><a class="btn" href="${x.href}" target="_blank" rel="noopener">Open ↗</a><button class="btn alt" onclick="details(${all.indexOf(x)})">Details</button></div></article>`).join(""):`<div class="empty">No documents match the current search or filters.</div>`;
}
function familyKey(name){
 return name.toLowerCase().replace(/\.[^.]+$/,"").replace(/[\s_-]*(pdf|html|htm|docx|txt|md)$/,"").replace(/[a-z]$/,"");
}
function details(i){
 const x=all[i], key=familyKey(x.name);
 const related=all.filter(y=>y!==x && familyKey(y.name)===key && y.folder===x.folder);
 document.getElementById("mtitle").textContent=x.name;
 document.getElementById("mbody").innerHTML=`<div class="detail-grid">
 <div class="box"><small>Folder</small>${esc(x.folder)}</div><div class="box"><small>Type</small>${esc(ext(x.ext))}</div>
 <div class="box"><small>Size</small>${esc(x.size)}</div><div class="box"><small>Path</small>${esc(x.name)}</div></div>
 <a class="btn" href="${x.href}" target="_blank" rel="noopener">Open document ↗</a>
 ${related.length?`<div class="related"><h3>Related files</h3>${related.map(y=>`<a href="${y.href}" target="_blank" rel="noopener">📄 ${esc(y.name)} · ${esc(y.size)}</a>`).join("")}</div>`:"<div class='related'><h3>No related file detected</h3></div>"}`;
 document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("search").addEventListener("input",render);
document.getElementById("sort").addEventListener("change",render);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
init();
</script></body></html>
